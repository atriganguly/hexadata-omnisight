services:
  omnisight-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hexadata-omnisight-backend
    restart: unless-stopped
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/v1/telemetry"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      - LLAMA_SERVER_HOST=172.17.0.1
      - LLAMA_SERVER_PORT=8080
      - MODEL_DIR=/root/llama.cpp/models
      - WATCHDOG_LOG=/var/log/llama-watchdog.log
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /root/llama.cpp/models:/root/llama.cpp/models:ro
      - /var/log/llama-watchdog.log:/var/log/llama-watchdog.log:ro

  omnisight-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hexadata-omnisight-frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_TELEMETRY_WS_URL=ws://172.16.1.142:9000/ws/telemetry
      - NEXT_PUBLIC_TELEMETRY_API_URL=http://172.16.1.142:9000/api/v1
    depends_on:
      omnisight-backend:
        condition: service_healthy